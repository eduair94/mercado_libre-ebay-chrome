<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eBay URL Generation Test</title>
  </head>
  <body>
    <h1>Testing eBay URL Generation with Price Filtering</h1>

    <script>
      function optimizeSearchQuery(productName) {
        return productName; // Simplified for testing
      }

      function createSearchURL(platform, query, maxPrice) {
        const optimizedQuery = optimizeSearchQuery(query);

        if (platform === "ebay") {
          const searchParams = {
            _nkw: optimizedQuery,
            _sacat: "0",
            LH_BIN: "1",
            _sop: "15",
            rt: "nc",
            LH_ItemCondition: "1000|1500|2000|2500|3000",
            _pgn: "1",
            _skc: "50",
          };

          // Add max price filter if provided
          if (maxPrice && maxPrice > 0) {
            searchParams._udhi = Math.floor(maxPrice).toString();
          }

          return "https://www.ebay.com/sch/i.html?" + new URLSearchParams(searchParams).toString();
        }
        return "";
      }

      // Test cases
      const tests = [
        { query: "iPhone 13", maxPrice: undefined, expected: "no price filter" },
        { query: "iPhone 13", maxPrice: 500, expected: "max price $500" },
        { query: "Samsung Galaxy", maxPrice: 300.75, expected: "max price $300 (rounded down)" },
        { query: "Laptop Gaming", maxPrice: 0, expected: "no price filter (0 price)" },
      ];

      document.body.innerHTML += "<h2>Test Results:</h2>";

      tests.forEach((test, index) => {
        const url = createSearchURL("ebay", test.query, test.maxPrice);
        const hasUdhi = url.includes("_udhi=");
        const udhiValue = hasUdhi ? url.match(/_udhi=([^&]*)/)?.[1] : "none";

        document.body.innerHTML += `
                <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc;">
                    <h3>Test ${index + 1}: ${test.query}</h3>
                    <p><strong>Max Price:</strong> ${test.maxPrice || "undefined"}</p>
                    <p><strong>Expected:</strong> ${test.expected}</p>
                    <p><strong>URL:</strong> <a href="${url}" target="_blank">${url}</a></p>
                    <p><strong>_udhi Parameter:</strong> ${udhiValue}</p>
                    <p><strong>Result:</strong> ${hasUdhi ? "✅ Price filter applied" : "❌ No price filter"}</p>
                </div>
            `;
      });
    </script>
  </body>
</html>
