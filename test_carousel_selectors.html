<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Carousel Selectors</title>
  </head>
  <body>
    <h1>Test Carousel Selectors</h1>
    <div id="results"></div>

    <!-- Load the product page HTML via iframe -->
    <iframe id="productFrame" src="samples/productPage.html" width="100%" height="600"></iframe>

    <script>
      // Test the selectors we're using
      const selectors = {
        PDP_RECOMMENDATIONS_CONTAINER: ".ui-recommendations-carousel-wrapper-ref, .andes-carousel-snapped__wrapper",
        PDP_RECOMMENDATION_ITEMS: ".andes-carousel-snapped__slide .recos-polycard, .recos-polycard.poly-card",
        PDP_RECOMMENDATION_TITLE: ".poly-component__title",
        PDP_RECOMMENDATION_PRICE_CURRENCY: ".poly-component__price .andes-money-amount__currency-symbol",
        PDP_RECOMMENDATION_PRICE_FRACTION: ".poly-component__price .andes-money-amount__fraction",
      };

      const resultsDiv = document.getElementById("results");
      const iframe = document.getElementById("productFrame");

      // Wait for iframe to load
      iframe.onload = function () {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

        Object.entries(selectors).forEach(([name, selector]) => {
          const elements = iframeDoc.querySelectorAll(selector);
          const resultElement = document.createElement("div");
          resultElement.innerHTML = `
                    <h3>${name}: "${selector}"</h3>
                    <p>Found: ${elements.length} elements</p>
                    <ul>
                        ${Array.from(elements)
                          .slice(0, 5)
                          .map((el, index) => `<li>Element ${index + 1}: ${el.tagName}${el.className ? " (class: " + el.className + ")" : ""}${el.textContent ? ' - Text: "' + el.textContent.trim().substring(0, 50) + '..."' : ""}</li>`)
                          .join("")}
                    </ul>
                    <hr>
                `;
          resultsDiv.appendChild(resultElement);
        });
      };
    </script>
  </body>
</html>
